name: Deploy Backend to QA

on:
  push:
    branches: [qa]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-qa.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --omit=dev

      # Requires WEBSITE_RUN_FROM_PACKAGE=1 on the Function App. Without it,
      # Kudu extracts and copies every file in the zip individually, which
      # times out on the Free plan once node_modules gets large (the Azure
      # AI Foundry SDKs alone are 20k+ files).
      - name: Deploy to Azure Function App (QA)
        uses: Azure/functions-action@v1
        with:
          app-name: learnly-api-qa
          package: backend
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_QA }}
